<!-- @dsCard group="Summary" height=150 subtitle="Resting, signal, zero and pressed" -->
<div class="kpis"><button class="kpi"><b>34</b><span>Course files</span></button><button class="kpi ok"><b>5</b><span>Complete</span></button><button class="kpi ready on" aria-pressed="true"><b>2</b><span>Ready to review</span></button><button class="kpi late zero"><b>0</b><span>Overdue</span></button></div>
<style>
body{margin:0;background:var(--surface);font-family:var(--font-body)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:20px}
.kpi{position:relative;display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--raised);border-radius:var(--radius-lg);padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
.kpi b{font-family:var(--font-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0}
.ok b{color:var(--ok)}.ok::after{background:var(--ok)}
.ready b{color:var(--accent)}.ready::after{background:var(--accent)}
.late b{color:var(--miss)}
.zero b{color:var(--muted);opacity:.7}.zero::after{background:transparent}
.on{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
</style>
<script></script>
